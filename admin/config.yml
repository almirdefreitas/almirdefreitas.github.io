backend:
  name: git-gateway
  branch: main
  identity_url: https://statuesque-choux-7d3e87.netlify.app/.netlify/identity
  gateway_url: https://statuesque-choux-7d3e87.netlify.app/.netlify/git

publish_mode: simple
media_folder: "img/posts"
public_folder: "../img/posts"

site_url: https://almirdefreitas.com.br
display_url: https://almirdefreitas.com.br

locale: "pt"

collections:
  - name: "textos"
    label: "Textos"
    label_singular: "Texto"
    folder: "textos"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    extension: "html"
    format: "yaml-frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "date", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Literatura", value: "literatura" }
          - { label: "Cinema", value: "cinema" }
          - { label: "Entrevista", value: "entrevista" }
          - { label: "Vida e obra", value: "vida-e-obra" }
          - { label: "Ideias", value: "ideias" }
          - { label: "Viagem", value: "viagem" }
          - { label: "Clássicos", value: "classicos" }
      - label: "Corpo do texto"
        name: "body"
        widget: "markdown"

  - name: "posts_blog"
    label: "Posts do blog (arquivo)"
    label_singular: "Post do blog"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    extension: "html"
    format: "yaml-frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "date", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY" }
      - label: "Corpo do texto"
        name: "body"
        widget: "markdown"
